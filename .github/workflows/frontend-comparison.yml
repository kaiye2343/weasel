name: Official frontend comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      # Read the full-build cache, but never save a partial header/container cache
      # under the full-build key if this standalone job encounters a cache miss.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: boost
        with:
          path: ${{ github.workspace }}\deps\boost_1_84_0
          key: shorekeeper-windows2022-v143-boost-1.84.0-x86-x64
      - name: Prepare Boost headers if cache unavailable
        if: steps.boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest https://archives.boost.io/release/1.84.0/source/boost_1_84_0.7z -OutFile boost.7z
          7z x boost.7z -odeps -y
          if ($LASTEXITCODE -ne 0) { throw 'Boost extraction failed' }
          Push-Location deps/boost_1_84_0
          cmd /c bootstrap.bat
          if ($LASTEXITCODE -ne 0) { throw 'Boost bootstrap failed' }
          ./b2.exe --with-container variant=release link=static runtime-link=static threading=multi address-model=64 toolset=msvc -j2 stage
          if ($LASTEXITCODE -ne 0) { throw 'Boost container build failed' }
          Pop-Location
      - name: Extract exact official baseline and build identical driver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .tools/official-source -Force | Out-Null
          git archive --format=tar -o .tools/official-source.tar 0.17.4
          tar -xf .tools/official-source.tar -C .tools/official-source
          if ($LASTEXITCODE -ne 0) { throw 'Official source extraction failed' }
          ./tools/build-frontend-comparison.ps1 -SourceRoot .tools/official-source -OutputRoot .tools/frontend/official -BoostRoot "$env:GITHUB_WORKSPACE/deps/boost_1_84_0"
          ./tools/build-frontend-comparison.ps1 -SourceRoot . -OutputRoot .tools/frontend/fork -BoostRoot "$env:GITHUB_WORKSPACE/deps/boost_1_84_0" -Fork
          git rev-parse HEAD 0.17.4 | Set-Content .tools/frontend/source-commits.txt
      - name: Sequential ABBA comparison on synthetic data only
        shell: pwsh
        run: |
          foreach ($case in @('official-a','fork-a','fork-b','official-b')) {
            $backend = if ($case.StartsWith('official')) { 'official' } else { 'fork' }
            & ".tools/frontend/$backend/frontend-comparison.exe" ".tools/frontend/$case.csv" --ci-ui
            if ($LASTEXITCODE -ne 0) { throw "Benchmark failed: $case" }
          }
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,CsProcessors | Format-List | Out-File .tools/frontend/environment.txt
          Get-ChildItem .tools/frontend -Recurse -File | Where-Object Extension -in '.exe','.csv' | Get-FileHash | Format-Table -AutoSize | Out-File .tools/frontend/hashes.txt -Width 240
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-comparison
          path: |
            .tools/frontend/**/*.exe
            .tools/frontend/*.csv
            .tools/frontend/*.txt
