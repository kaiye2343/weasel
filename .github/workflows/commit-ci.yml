name: Shorekeeper build

on:
  workflow_dispatch:
  push:
    branches: [shorekeeper]
  pull_request:
    branches: [shorekeeper]

permissions:
  contents: read

concurrency:
  group: shorekeeper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test skin import, profiles and sync protocol
        shell: pwsh
        run: |
          dotnet run --project manager/Shorekeeper.Tests -c Release -- .
          if ($LASTEXITCODE -ne 0) { throw 'Managed tests failed' }
      - name: Publish self-contained manager
        shell: pwsh
        run: |
          dotnet publish manager/Shorekeeper.Manager -c Release -r win-x64 --self-contained true -o output/archives/tools
          if ($LASTEXITCODE -ne 0) { throw 'Manager publish failed' }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure VS 2022
        shell: pwsh
        run: Copy-Item env.vs2022.bat env.bat
      - name: Test skin geometry
        shell: cmd
        run: |
          cl /nologo /EHsc /W4 tests\skin_geometry_test.cpp /Fe:skin_geometry_test.exe
          if errorlevel 1 exit /b 1
          skin_geometry_test.exe
          if errorlevel 1 exit /b 1
      - name: Prepare installer tools
        shell: pwsh
        run: |
          choco install nsis aria2 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Installer tools setup failed' }
      - uses: actions/cache@v4
        id: boost
        with:
          path: ${{ env.BOOST_ROOT }}
          key: shorekeeper-windows2022-v143-boost-1.84.0-x86-x64
      - name: Build Boost
        if: steps.boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call install_boost.bat
          if errorlevel 1 exit /b 1
      - name: Fetch pinned librime SDK
        shell: pwsh
        run: ./get-rime.ps1 -tag 1.13.1 -use dev
      - name: Build dictionaries
        shell: cmd
        run: |
          call build.bat data
          if errorlevel 1 exit /b 1
      - name: Test official Rime learning and snapshot merge
        shell: cmd
        run: |
          cl /nologo /EHsc /std:c++17 /utf-8 /Iinclude tests\rime_learning_test.cpp /Fe:output\rime_learning_test.exe /link /LIBPATH:lib rime.lib
          if errorlevel 1 exit /b 1
          output\rime_learning_test.exe .tools\native-learning
          if errorlevel 1 exit /b 1
      - name: Build complete x64 and x86 package
        shell: cmd
        run: |
          call build.bat installer
          if errorlevel 1 exit /b 1
      - name: Package skin samples and provenance
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem output/archives -Filter 'weasel*.exe')
          if ($installers.Count -eq 0) { throw 'Build produced no installer' }
          foreach ($file in @('output/WeaselServer.exe', 'output/WeaselDeployer.exe', 'output/weasel.dll', 'output/weaselx64.dll', 'output/Win32/WeaselServer.exe')) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing component: $file" }
          }
          msbuild WeaselSkinPreview/WeaselSkinPreview.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$env:GITHUB_WORKSPACE\"
          if ($LASTEXITCODE -ne 0) { throw 'Native preview build failed' }
          foreach ($file in @('WeaselSkinPreview.exe', 'WeaselServer.exe', 'rime.dll', 'WinSparkle.dll')) {
            if (!(Test-Path "output/$file")) { throw "Missing tool dependency: $file" }
            Copy-Item "output/$file" output/archives/tools/
          }
          ./tools/pack-skin.ps1
          Copy-Item docs/SHOREKEEPER.md output/archives/SHOREKEEPER.md
          Copy-Item docs/skin-format.md output/archives/skin-format.md
          Copy-Item docs/rimeskin.schema.json output/archives/rimeskin.schema.json
          git rev-parse HEAD | Set-Content output/archives/commit.txt
          Get-ChildItem output/archives -Recurse -File | Where-Object Name -ne 'SHA256SUMS.txt' | Get-FileHash -Algorithm SHA256 |
            Format-Table Hash, Path -AutoSize | Out-String -Width 300 |
            Set-Content output/archives/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shorekeeper-weasel-${{ github.sha }}
          path: output/archives/
          if-no-files-found: error
          retention-days: 14
