name: Rime Weasel build

on:
  workflow_dispatch:
  push:
    branches: [shorekeeper]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [shorekeeper]

permissions:
  contents: read

concurrency:
  group: shorekeeper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VSLANG: '1033'
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: designer/package-lock.json
      - name: Test offline skin designer
        shell: pwsh
        run: |
          npm ci --prefix designer --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Designer test dependency setup failed' }
          node tests/designer_test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Designer package/geometry tests failed' }
          node --test tests/native_diagnostics_test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native diagnostics parser tests failed' }
          Push-Location designer
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Headless Chromium setup failed' }
          Pop-Location
          node tests/designer_browser_test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Offline browser regression failed' }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Test skin import, profiles and sync protocol
        shell: pwsh
        run: |
          dotnet run --project manager/Shorekeeper.Tests -c Release -- .
          if ($LASTEXITCODE -ne 0) { throw 'Managed tests failed' }
      - name: Publish self-contained manager
        shell: pwsh
        run: |
          dotnet publish manager/Shorekeeper.Manager -c Release -r win-x64 --self-contained true -o output/archives/tools
          if ($LASTEXITCODE -ne 0) { throw 'Manager publish failed' }
      - name: Test settings pages with isolated data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools/settings-smoke/rime | Out-Null
          Copy-Item tests/settings-fixture/* .tools/settings-smoke/rime/
          $root = "$env:GITHUB_WORKSPACE/.tools/settings-smoke"
          $test = Start-Process output/archives/tools/Shorekeeper.Manager.exe -ArgumentList @('--rime-root', "$root/rime", '--data-root', "$root/skins", '--preview-mode', '--ui-smoke', '--capture-image', "$env:GITHUB_WORKSPACE/output/archives/settings-center.png") -WindowStyle Hidden -PassThru
          if (!$test.WaitForExit(60000)) { throw 'Settings UI smoke timed out' }
          if ($test.ExitCode -ne 0) {
            if (Test-Path "$root/skins/ui-smoke-error.txt") { Get-Content "$root/skins/ui-smoke-error.txt" }
            throw "Settings UI smoke failed: $($test.ExitCode)"
          }
      - name: Test repeated settings center launch
        shell: pwsh
        run: ./tools/test-settings-instance.ps1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Configure VS 2022
        shell: pwsh
        run: Copy-Item env.vs2022.bat env.bat
      - name: Test skin geometry
        shell: cmd
        run: |
          cl /nologo /EHsc /W4 tests\skin_geometry_test.cpp /Fe:skin_geometry_test.exe
          if errorlevel 1 exit /b 1
          skin_geometry_test.exe
          if errorlevel 1 exit /b 1
      - name: Prepare installer tools
        shell: pwsh
        run: |
          choco install nsis aria2 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Installer tools setup failed' }
      - name: Test image decoding failure diagnostics without UI
        shell: cmd
        run: |
          cl /nologo /EHsc /std:c++17 /W4 tests\skin_image_loader_test.cpp /Fe:.tools\skin_image_loader_test.exe /Fo:.tools\skin_image_loader_test.obj
          if errorlevel 1 exit /b 1
          .tools\skin_image_loader_test.exe skins\shorekeeper\shorekeeper-watermelon.png
          if errorlevel 1 exit /b 1
      - name: Test skin publication and real AppContainer access without UI
        shell: pwsh
        run: ./tools/test-skin-publication.ps1
      - name: Test physical skin resource paths across caller views
        shell: pwsh
        run: ./tools/test-skin-asset-path.ps1
      - name: Test cached decoration pixels without UI
        shell: cmd
        run: |
          cl /nologo /EHsc /std:c++17 /W4 tests\skin_image_scaling_test.cpp /Fe:.tools\skin_image_scaling_test.exe /Fo:.tools\skin_image_scaling_test.obj
          if errorlevel 1 exit /b 1
          .tools\skin_image_scaling_test.exe skins\shorekeeper\shorekeeper-watermelon.png
          if errorlevel 1 exit /b 1
      - name: Compare cached GDI and upstream WARP technique without UI
        shell: cmd
        run: |
          cl /nologo /EHsc /std:c++17 /W4 tests\render_backend_benchmark.cpp /Fe:.tools\render_backend_benchmark.exe /Fo:.tools\render_backend_benchmark.obj
          if errorlevel 1 exit /b 1
          .tools\render_backend_benchmark.exe skins\shorekeeper\shorekeeper-watermelon.png
          if errorlevel 1 exit /b 1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: boost
        with:
          path: ${{ env.BOOST_ROOT }}
          key: shorekeeper-windows2022-v143-boost-1.84.0-x86-x64
      - name: Build Boost
        if: steps.boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call install_boost.bat
          if errorlevel 1 exit /b 1
      - name: Fetch pinned librime SDK
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./get-rime.ps1 -tag 1.13.1 -use dev
      - name: Test upstream IPC fixes with negative controls
        shell: pwsh
        run: ./tools/test-upstream-ipc.ps1
      - name: Test upstream response, hover and version adaptations without UI
        shell: pwsh
        run: ./tools/test-upstream-adaptations.ps1
      - name: Test dictionary CLI with isolated Rime and maintenance failures
        shell: pwsh
        run: ./tools/test-deployer-cli.ps1
      - name: Verify pinned librime SDK files
        shell: pwsh
        run: |
          foreach ($file in @('include/rime_api.h', 'include/rime_levers_api.h', 'lib/rime.lib', 'lib64/rime.lib', 'output/rime.dll', 'output/Win32/rime.dll')) {
            if (!(Test-Path -LiteralPath $file) -or (Get-Item -LiteralPath $file).Length -eq 0) { throw "SDK download incomplete: $file" }
          }
      - name: Test native timing, IPC bounds and control tree isolation
        shell: pwsh
        run: |
          ./tools/test-native-start-time.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native start/time regression failed' }
          ./tools/test-native-ipc-bounds.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native IPC bounds regression failed' }
          ./tools/test-native-lifetimes.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native lifetime regression failed' }
          ./tools/test-native-profile-contracts.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native profile contract regression failed' }
          ./tools/test-symbol-parser.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PE CodeView parser regression failed' }
          pwsh -NoProfile -File tests/native_control_tree_test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native control tree isolation test failed' }
      - name: Test Win32 native contracts
        shell: cmd
        run: |
          call "%VSINSTALLDIR%VC\Auxiliary\Build\vcvarsall.bat" x86
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File tools/test-native-start-time.ps1
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File tools/test-native-ipc-bounds.ps1
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File tools/test-native-lifetimes.ps1
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File tools/test-native-profile-contracts.ps1
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File tools/test-symbol-parser.ps1
          if errorlevel 1 exit /b 1
      - name: Build dictionaries
        shell: cmd
        run: |
          call build.bat data
          if errorlevel 1 exit /b 1
      - name: Test official Rime learning and snapshot merge
        shell: cmd
        run: |
          cl /nologo /EHsc /std:c++17 /utf-8 /Iinclude tests\rime_learning_test.cpp /Fe:output\rime_learning_test.exe /link /LIBPATH:lib64 rime.lib
          if errorlevel 1 exit /b 1
          output\rime_learning_test.exe .tools\native-learning
          if errorlevel 1 exit /b 1
      - name: Build complete x64 and x86 package
        shell: cmd
        env:
          WEASEL_SKIP_INSTALLER: '1'
        run: |
          call build.bat rebuild installer
          if errorlevel 1 exit /b 1
      - name: Build native previews
        shell: pwsh
        run: |
          msbuild WeaselSkinPreview/WeaselSkinPreview.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$env:GITHUB_WORKSPACE\" /fl '/flp:logfile=msbuild-preview-x64.log;verbosity=normal;encoding=UTF-8'
          if ($LASTEXITCODE -ne 0) { throw 'Native preview x64 build failed' }
          msbuild WeaselSkinPreview/WeaselSkinPreview.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:SolutionDir="$env:GITHUB_WORKSPACE\" /fl '/flp:logfile=msbuild-preview-Win32.log;verbosity=normal;encoding=UTF-8'
          if ($LASTEXITCODE -ne 0) { throw 'Native preview Win32 build failed' }
      - name: Test isolated historical controls
        shell: pwsh
        run: ./tools/test-native-regressions.ps1
      - name: Validate native PDB identity and symbol records
        shell: pwsh
        run: ./tools/test-native-symbols.ps1 -VerifyProduction
      - name: Enforce native diagnostic baseline
        shell: pwsh
        run: ./tools/check-build-diagnostics.ps1
      - name: Validate native previews and prepare package contents
        # Negative controls run in isolated .tools/native-baseline-* snapshots and
        # never overwrite production sources or formal build outputs.
        shell: pwsh
        run: |
          ./tools/test-deployer-cli.ps1 -VerifyPackage
          foreach ($file in @('output/WeaselServer.exe', 'output/WeaselDeployer.exe', 'output/weasel.dll', 'output/weaselx64.dll', 'output/Win32/WeaselServer.exe')) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing component: $file" }
          }
          $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList '--publication-test' -WindowStyle Hidden -PassThru
          if (!$test.WaitForExit(60000)) { $test.Kill(); throw 'Native style publication test timed out' }
          Get-Content native-publication-test.log
          if ($test.ExitCode -ne 0) { throw 'Native style publication transaction failed' }
          Copy-Item native-publication-test.log output/archives/native-publication-test.log
          foreach ($sample in @(@('neutral','light'), @('shorekeeper','plush'))) {
            $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList @('--manifest', "$env:GITHUB_WORKSPACE/skins/$($sample[0])/manifest.json", '--variant', $sample[1], '--placement-test', 'true') -WindowStyle Hidden -PassThru
            if (!$test.WaitForExit(60000)) { $test.Kill(); throw 'Native placement regression timed out' }
            Get-Content native-placement-test.log
            if ($test.ExitCode -ne 0) { throw 'Native caret placement regression failed' }
            Copy-Item native-placement-test.log "output/archives/placement-$($sample[0]).log"
          }
          $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList '--layout-test' -WindowStyle Hidden -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw "Native annotation/DPI layout tests failed: $($test.ExitCode)" }
          $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList '--preferences-test' -WindowStyle Hidden -PassThru -Wait
          if (Test-Path native-preferences-test.log) { Get-Content native-preferences-test.log }
          if ($test.ExitCode -ne 0) { throw "Native display preferences tests failed: $($test.ExitCode)" }
          $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList @('--smoke', 'true') -WindowStyle Hidden -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw "Native no-skin preview failed: $($test.ExitCode)" }
          foreach ($variant in @('light', 'dark')) {
            $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList @('--manifest', "$env:GITHUB_WORKSPACE/skins/neutral/manifest.json", '--variant', $variant, '--smoke', 'true') -WindowStyle Hidden -PassThru -Wait
            if ($test.ExitCode -ne 0) { throw "Native pure-color skin failed: $($test.ExitCode)" }
          }
          foreach ($variant in @('plush', 'watermelon', 'butterfly')) {
            $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList @('--manifest', "$env:GITHUB_WORKSPACE/skins/shorekeeper/manifest.json", '--variant', $variant, '--smoke', 'true') -WindowStyle Hidden -PassThru -Wait
            if ($test.ExitCode -ne 0) { throw "Native skin load/redraw failed for $variant`: $($test.ExitCode)" }
          }
          $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList @('--manifest', "$env:GITHUB_WORKSPACE/skins/shorekeeper/manifest.json", '--variant', 'watermelon', '--redraw-test', 'true') -WindowStyle Hidden -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw "Style-only repaint/resource rollback regression failed: $($test.ExitCode)" }
          $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList @('--manifest', "$env:GITHUB_WORKSPACE/skins/shorekeeper/manifest.json", '--variant', 'watermelon', '--performance-test', 'true') -WindowStyle Hidden -PassThru
          if (!$test.WaitForExit(180000)) { throw 'Synthetic long-candidate performance capture timed out' }
          if ($test.ExitCode -ne 0) { throw "Performance capture failed: $($test.ExitCode)" }
          Copy-Item native-performance-test.csv output/archives/
          foreach ($file in @('WeaselSkinPreview.exe', 'WeaselServer.exe', 'rime.dll', 'WinSparkle.dll')) {
            if (!(Test-Path "output/$file")) { throw "Missing tool dependency: $file" }
            Copy-Item "output/$file" output/archives/tools/
          }
          node tools/pack-designer.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Offline designer packaging failed' }
          Copy-Item render-backend-benchmark.csv output/archives/
          Copy-Item .tools/designer-browser/designer.png output/archives/designer-browser.png
          ./tools/package-installer.ps1
          $installers = @(Get-ChildItem output/archives -Filter 'weasel*.exe')
          if ($installers.Count -eq 0) { throw 'Build produced no installer' }
          ./tools/pack-skin.ps1
          ./tools/pack-skin.ps1 -Source skins/neutral -Destination output/archives/neutral-1.0.0.rimeskin
          foreach ($folder in @('studio-demo', 'studio-plain')) {
            foreach ($variant in @('light', 'night')) {
              $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList @('--manifest', "$env:GITHUB_WORKSPACE/skins/$folder/manifest.json", '--variant', $variant, '--smoke', 'true') -WindowStyle Hidden -PassThru -Wait
              if ($test.ExitCode -ne 0) { throw "Designer sample native preview failed: $folder $variant" }
            }
          }
          Copy-Item docs/SETTINGS-CENTER.md output/archives/SETTINGS-CENTER.md
          Copy-Item docs/SHOREKEEPER.md output/archives/SHOREKEEPER.md
          Copy-Item docs/skin-format.md output/archives/skin-format.md
          Copy-Item docs/rimeskin.schema.json output/archives/rimeskin.schema.json
          git rev-parse HEAD | Set-Content output/archives/commit.txt
          $archiveRoot = (Resolve-Path output/archives).Path
          Get-ChildItem output/archives -Recurse -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' -and !$_.Name.StartsWith('.') } | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($archiveRoot, $_.FullName).Replace('\', '/')
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)  $relative"
          } | Set-Content output/archives/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shorekeeper-weasel-${{ github.sha }}
          path: output/archives/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: shorekeeper-failure-${{ github.sha }}
          include-hidden-files: true
          path: |
            msbuild*.log
            output/archives/build-diagnostics.json
            output/archives/build-diagnostics.md
            .tools/native-diagnostics-inputs.json
            native-preferences-test.log
            native-publication-test.log
            native-placement-test.log
            native-layout-test.log
            native-redraw-test.log
            native-performance-test.csv
            render-backend-benchmark.csv
            .tools/designer-browser/
            .tools/native-learning/
            .tools/settings-smoke/skins/ui-smoke-error.txt
            .tools/native-baseline-*/native-*-test.log
            .tools/native-baseline-*/**/native-*-test.log
            .tools/native-baseline-*/**/control-build.log
            .tools/native-start-time-*/**
            .tools/native-ipc-bounds-*/**
            .tools/native-lifetimes-*/**
            .tools/native-profile-contracts-*/**
            .tools/native-symbols-*/**
            .tools/symbol-parser-*/**
            .tools/upstream-ipc-*/*/*.log
            .tools/deployer-cli-*/*.log
            .tools/deployer-cli-*/real-rime/*.log
            .tools/skin-publication/**/**.log
          if-no-files-found: ignore
          retention-days: 7
