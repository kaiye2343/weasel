name: Rime Weasel build

on:
  workflow_dispatch:
  push:
    branches: [shorekeeper]
  pull_request:
    branches: [shorekeeper]

permissions:
  contents: read

concurrency:
  group: shorekeeper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test skin import, profiles and sync protocol
        shell: pwsh
        run: |
          dotnet run --project manager/Shorekeeper.Tests -c Release -- .
          if ($LASTEXITCODE -ne 0) { throw 'Managed tests failed' }
      - name: Publish self-contained manager
        shell: pwsh
        run: |
          dotnet publish manager/Shorekeeper.Manager -c Release -r win-x64 --self-contained true -o output/archives/tools
          if ($LASTEXITCODE -ne 0) { throw 'Manager publish failed' }
      - name: Test settings pages with isolated data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools/settings-smoke/rime | Out-Null
          Copy-Item tests/settings-fixture/* .tools/settings-smoke/rime/
          $root = "$env:GITHUB_WORKSPACE/.tools/settings-smoke"
          $test = Start-Process output/archives/tools/Shorekeeper.Manager.exe -ArgumentList @('--rime-root', "$root/rime", '--data-root', "$root/skins", '--preview-mode', '--ui-smoke', '--capture-image', "$env:GITHUB_WORKSPACE/output/archives/settings-center.png") -WindowStyle Hidden -PassThru
          if (!$test.WaitForExit(60000)) { throw 'Settings UI smoke timed out' }
          if ($test.ExitCode -ne 0) {
            if (Test-Path "$root/skins/ui-smoke-error.txt") { Get-Content "$root/skins/ui-smoke-error.txt" }
            throw "Settings UI smoke failed: $($test.ExitCode)"
          }
      - name: Test repeated settings center launch
        shell: pwsh
        run: ./tools/test-settings-instance.ps1
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure VS 2022
        shell: pwsh
        run: Copy-Item env.vs2022.bat env.bat
      - name: Test skin geometry
        shell: cmd
        run: |
          cl /nologo /EHsc /W4 tests\skin_geometry_test.cpp /Fe:skin_geometry_test.exe
          if errorlevel 1 exit /b 1
          skin_geometry_test.exe
          if errorlevel 1 exit /b 1
      - name: Prepare installer tools
        shell: pwsh
        run: |
          choco install nsis aria2 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Installer tools setup failed' }
      - name: Test image decoding failure diagnostics without UI
        shell: cmd
        run: |
          cl /nologo /EHsc /std:c++17 /W4 tests\skin_image_loader_test.cpp /Fe:.tools\skin_image_loader_test.exe /Fo:.tools\skin_image_loader_test.obj
          if errorlevel 1 exit /b 1
          .tools\skin_image_loader_test.exe skins\shorekeeper\shorekeeper-watermelon.png
          if errorlevel 1 exit /b 1
      - name: Test physical skin resource paths across caller views
        shell: pwsh
        run: ./tools/test-skin-asset-path.ps1
      - uses: actions/cache@v4
        id: boost
        with:
          path: ${{ env.BOOST_ROOT }}
          key: shorekeeper-windows2022-v143-boost-1.84.0-x86-x64
      - name: Build Boost
        if: steps.boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call install_boost.bat
          if errorlevel 1 exit /b 1
      - name: Fetch pinned librime SDK
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./get-rime.ps1 -tag 1.13.1 -use dev
      - name: Verify pinned librime SDK files
        shell: pwsh
        run: |
          foreach ($file in @('include/rime_api.h', 'include/rime_levers_api.h', 'lib/rime.lib', 'lib64/rime.lib', 'output/rime.dll', 'output/Win32/rime.dll')) {
            if (!(Test-Path -LiteralPath $file) -or (Get-Item -LiteralPath $file).Length -eq 0) { throw "SDK download incomplete: $file" }
          }
      - name: Build dictionaries
        shell: cmd
        run: |
          call build.bat data
          if errorlevel 1 exit /b 1
      - name: Test official Rime learning and snapshot merge
        shell: cmd
        run: |
          cl /nologo /EHsc /std:c++17 /utf-8 /Iinclude tests\rime_learning_test.cpp /Fe:output\rime_learning_test.exe /link /LIBPATH:lib64 rime.lib
          if errorlevel 1 exit /b 1
          output\rime_learning_test.exe .tools\native-learning
          if errorlevel 1 exit /b 1
      - name: Build complete x64 and x86 package
        shell: cmd
        env:
          WEASEL_SKIP_INSTALLER: '1'
        run: |
          call build.bat installer
          if errorlevel 1 exit /b 1
      - name: Package skin samples and provenance
        # Negative tests compile the old algorithms, require their exact failure codes,
        # then restore and rebuild the repaired algorithms before packaging.
        shell: pwsh
        run: |
          foreach ($file in @('output/WeaselServer.exe', 'output/WeaselDeployer.exe', 'output/weasel.dll', 'output/weaselx64.dll', 'output/Win32/WeaselServer.exe')) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing component: $file" }
          }
          msbuild WeaselSkinPreview/WeaselSkinPreview.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$env:GITHUB_WORKSPACE\"
          if ($LASTEXITCODE -ne 0) { throw 'Native preview build failed' }
          ./tools/test-native-regressions.ps1
          $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList '--layout-test' -WindowStyle Hidden -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw "Native annotation/DPI layout tests failed: $($test.ExitCode)" }
          $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList '--preferences-test' -WindowStyle Hidden -PassThru -Wait
          if (Test-Path native-preferences-test.log) { Get-Content native-preferences-test.log }
          if ($test.ExitCode -ne 0) { throw "Native display preferences tests failed: $($test.ExitCode)" }
          $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList @('--smoke', 'true') -WindowStyle Hidden -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw "Native no-skin preview failed: $($test.ExitCode)" }
          foreach ($variant in @('light', 'dark')) {
            $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList @('--manifest', "$env:GITHUB_WORKSPACE/skins/neutral/manifest.json", '--variant', $variant, '--smoke', 'true') -WindowStyle Hidden -PassThru -Wait
            if ($test.ExitCode -ne 0) { throw "Native pure-color skin failed: $($test.ExitCode)" }
          }
          foreach ($variant in @('plush', 'watermelon', 'butterfly')) {
            $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList @('--manifest', "$env:GITHUB_WORKSPACE/skins/shorekeeper/manifest.json", '--variant', $variant, '--smoke', 'true') -WindowStyle Hidden -PassThru -Wait
            if ($test.ExitCode -ne 0) { throw "Native skin load/redraw failed for $variant`: $($test.ExitCode)" }
          }
          $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList @('--manifest', "$env:GITHUB_WORKSPACE/skins/shorekeeper/manifest.json", '--variant', 'watermelon', '--redraw-test', 'true') -WindowStyle Hidden -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw "Style-only repaint/resource rollback regression failed: $($test.ExitCode)" }
          $test = Start-Process output/WeaselSkinPreview.exe -ArgumentList @('--manifest', "$env:GITHUB_WORKSPACE/skins/shorekeeper/manifest.json", '--variant', 'watermelon', '--performance-test', 'true') -WindowStyle Hidden -PassThru
          if (!$test.WaitForExit(180000)) { throw 'Synthetic long-candidate performance capture timed out' }
          if ($test.ExitCode -ne 0) { throw "Performance capture failed: $($test.ExitCode)" }
          Copy-Item native-performance-test.csv output/archives/
          foreach ($file in @('WeaselSkinPreview.exe', 'WeaselServer.exe', 'rime.dll', 'WinSparkle.dll')) {
            if (!(Test-Path "output/$file")) { throw "Missing tool dependency: $file" }
            Copy-Item "output/$file" output/archives/tools/
          }
          $env:WEASEL_SETTINGS_CENTER_DEFINE = '/DRIME_SETTINGS_CENTER_PACKAGE=1'
          cmd /c build.bat installer
          if ($LASTEXITCODE -ne 0) { throw 'Complete settings center installer failed' }
          $installers = @(Get-ChildItem output/archives -Filter 'weasel*.exe')
          if ($installers.Count -eq 0) { throw 'Build produced no installer' }
          ./tools/pack-skin.ps1
          ./tools/pack-skin.ps1 -Source skins/neutral -Destination output/archives/neutral-1.0.0.rimeskin
          Copy-Item docs/SETTINGS-CENTER.md output/archives/SETTINGS-CENTER.md
          Copy-Item docs/SHOREKEEPER.md output/archives/SHOREKEEPER.md
          Copy-Item docs/skin-format.md output/archives/skin-format.md
          Copy-Item docs/rimeskin.schema.json output/archives/rimeskin.schema.json
          git rev-parse HEAD | Set-Content output/archives/commit.txt
          $archiveRoot = (Resolve-Path output/archives).Path
          Get-ChildItem output/archives -Recurse -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' -and !$_.Name.StartsWith('.') } | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($archiveRoot, $_.FullName).Replace('\', '/')
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)  $relative"
          } | Set-Content output/archives/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: shorekeeper-weasel-${{ github.sha }}
          path: output/archives/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shorekeeper-failure-${{ github.sha }}
          include-hidden-files: true
          path: |
            msbuild*.log
            native-preferences-test.log
            native-layout-test.log
            native-redraw-test.log
            native-performance-test.csv
            .tools/native-learning/
            .tools/settings-smoke/skins/ui-smoke-error.txt
            .tools/native-baseline-*/native-*-test.log
          if-no-files-found: ignore
          retention-days: 7
